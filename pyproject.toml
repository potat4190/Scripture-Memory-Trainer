[project]
name = "scripture-memory-trainer"
version = "0.1.0"
description = "Multi-script scripture memorisation: Leitner scheduling, Unicode-aware answer checking, and a travellable clock."
readme = "README.md"
authors = [
    { name = "Rhidaya Shrestha", email = "rhidayash@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "regex>=2026.7.19",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-regex>=2026.7.19.20260720",
    "uvicorn[standard]>=0.52.4",
]
smoke = [
    "pytest-playwright>=0.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# docs/ holds prose with illustrative code blocks, not project source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The normalizer's whole job is handling confusable characters; RUF001-003
# would flag every Arabic letter and full-width form it deliberately names.
"src/scripture_memory_trainer/normalizer.py" = ["RUF001", "RUF002", "RUF003"]
# Same reason: these tests name curly quotes, full-width forms and Arabic and
# Devanagari marks on purpose -- that is the behaviour under test.
"tests/test_normalizer.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_properties.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/smoke needs a running deployment and a browser; it skips itself unless
# SMOKE_URL is set, and the `smoke` dependency group is not installed by default.
markers = ["smoke: runs against a deployed URL, not a local fixture"]

[tool.mypy]
python_version = "3.13"
strict = true
# tools/ is one-shot tooling, not shipped code, and its only import (openpyxl)
# is intentionally not a project dependency -- run it with `uv run --with openpyxl`.
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true
